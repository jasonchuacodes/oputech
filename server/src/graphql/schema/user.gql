type ActivityStatus {
  status: String!
  message: String
}

type User {
  id: ID!
  username: String!
  email: String
  role: String!
  activityStatus: ActivityStatus!
}

extend type Query {
  users: [User!]!
}

input CreateUserInput {
  username: String!
  email: String
  password: String!
  role: String
}

input ActivityStatusInput {
  status: String!
  message: String
}

extend type Mutation {
  createUser(input: CreateUserInput!): User!
  updateActivityStatus(id: ID!, input: ActivityStatusInput!): User!
}
