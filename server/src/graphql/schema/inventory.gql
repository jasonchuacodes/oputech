enum InventoryStatus {
  IN_STOCK
  LOW
  OUT_OF_STOCK
}

type InventoryItem {
  id: ID!
  name: String!
  quantity: Int!
  price: Float!
  imageUrl: String
  status: InventoryStatus!
}

extend type Query {
  inventoryItems(search: String): [InventoryItem!]!
}

input CreateInventoryItemInput {
  name: String!
  quantity: Int!
  price: Float!
  imageUrl: String
}

input UpdateInventoryItemInput {
  name: String
  price: Float
  addQuantity: Int
}

extend type Mutation {
  createInventoryItem(input: CreateInventoryItemInput!): InventoryItem!
  updateInventoryItem(id: ID!, input: UpdateInventoryItemInput!): InventoryItem!
  deleteInventoryItem(id: ID!): Boolean!
}
