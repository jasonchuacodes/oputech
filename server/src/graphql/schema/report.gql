type ProductSale {
  productId: String!
  name: String!
  quantitySold: Int!
  pricePerUnit: Float!
  total: Float!
}

type Report {
  id: ID!
  createdBy: User!
  fromDate: String!
  toDate: String!
  products: [ProductSale!]!
  totalCash: Float!
  totalGCash: Float!
  totalIncome: Float!
  createdAt: String!
  updatedAt: String!
}

input CreateReportInput {
  fromDate: String!
  toDate: String!
}

enum AnalyticsRange {
  LAST_7_DAYS
  LAST_15_DAYS
  LAST_MONTH
  LAST_6_MONTHS
}

type AnalyticsPoint {
  date: String!
  totalSales: Float!
  totalExpenses: Float!
}

type TopProduct {
  productId: String!
  name: String!
  quantitySold: Int!
}

type Analytics {
  series: [AnalyticsPoint!]!
  topProducts: [TopProduct!]!
  totalSales: Float!
  totalExpenses: Float!
}

extend type Query {
  reports: [Report!]!
  analytics(range: AnalyticsRange!): Analytics!
}

extend type Mutation {
  createReport(input: CreateReportInput!): Report!
  deleteReport(id: ID!): Boolean!
}
