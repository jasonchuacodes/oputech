type Expense {
  id: ID!
  reportId: ID!
  label: String!
  amount: Float!
  createdAt: String!
}

extend type Query {
  expenses(reportId: ID!): [Expense!]!
}

input CreateExpenseInput {
  reportId: ID!
  label: String!
  amount: Float!
}

extend type Mutation {
  createExpense(input: CreateExpenseInput!): Expense!
  deleteExpense(id: ID!): Boolean!
}
